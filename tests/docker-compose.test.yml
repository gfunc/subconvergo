services:
  # Main application service
  subconvergo:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "25500:25500"
    volumes:
      - ./base:/base
    working_dir: /base
    environment:
      - API_MODE=true
      - PORT=25500
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:25500/version"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - subconvergo-network
    depends_on:
      - mock-subscription

  subconverter:
    image: metacubex/subconverter:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "25550:25500"
    volumes:
      - ./base:/base
      - ./subconverter/all_base.tpl:/base/base/all_base.tpl
    working_dir: /base
    environment:
      - API_MODE=true
      - PORT=25500
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:25500/version"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - subconvergo-network
    depends_on:
      - mock-subscription

  # Mock subscription server for testing
  mock-subscription:
    image: nginx:alpine
    container_name: mock-subscription-server
    ports:
      - "8081:80"
    volumes:
      - ./mock-data:/usr/share/nginx/html:ro
    networks:
      - subconvergo-network

networks:
  subconvergo-network:
    driver: bridge
    # SECURITY-HARDENING NOTE: subconvergo's outbound fetcher refuses
    # loopback/private/link-local destinations (SSRF protection), so
    # mock-subscription on a default RFC1918 docker subnet is unreachable
    # ("blocked address 172.x"). The Go fetcher has no config-level allowlist
    # knob. To keep legitimate subscription-fetch coverage end-to-end, this
    # TEST network is numbered from TEST-NET-3 (203.0.113.0/24, RFC 5737
    # documentation range: unrouted, and not classified as internal by the
    # fetcher). This does NOT weaken the default blocking — loopback,
    # link-local/metadata, and RFC1918 refusal is pinned by
    # tests/test_security.py against the running container.
    ipam:
      config:
        - subnet: 203.0.113.0/24

